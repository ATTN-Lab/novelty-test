[project]
name = "patent-novelty-mcp"
version = "0.1.0"
description = "MCP server for cross-provider patent novelty checks"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.0.0",
  "mcp>=1.0.0",
  "selenium>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
